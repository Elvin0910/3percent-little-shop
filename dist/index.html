<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252f42">
  <meta name="description" content="Make tiny treasures and run a little shop on a San Francisco hillside.">
  <title>3% little shop</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-make" viewBox="0 0 24 24"><path d="m15 5 4 4M13.5 6.5l4 4m-8 7 10-10a2.1 2.1 0 0 0-3-3l-10 10-.8 3.8 3.8-.8ZM5 5v4M3 7h4m13 7v5m-2.5-2.5h5"/></symbol>
    <symbol id="i-stock" viewBox="0 0 24 24"><path d="M3 8v12h18V8M2 8h20V4H2zm7 4h6"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 9l2-5h14l2 5c-.4 2-3 3-4.5 1-1.3 2-3.2 2-4.5 0-1.3 2-3.2 2-4.5 0C6 12 3.4 11 3 9Zm7 11v-5h4v5"/></symbol>
    <symbol id="i-decor" viewBox="0 0 24 24"><path d="M8 14h8l-1 6H9l-1-6Zm4 0V7m0 4C7 11 6 8 6 5c4 0 6 2 6 6Zm0-2c0-4 2-6 6-6 0 4-2 6-6 6Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M5 15a4 4 0 1 1 1.1-7.9 6 6 0 0 1 11.1.4A3.8 3.8 0 1 1 19 15H5Zm3 3-1.3 3m6.3-3-1.3 3m6.3-3-1.3 3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.1a2.9 2.9 0 0 1 5.7.5c0 1.8-2.9 2.3-2.9 3.8m0 3.2h.01"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-goal" viewBox="0 0 24 24"><path d="M5 21V3m0 1h13l-2 4 2 4H5"/></symbol>
    <symbol id="i-neighbors" viewBox="0 0 24 24"><path d="M7 19v-2a4 4 0 0 1 8 0v2H7Zm4-9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7 9v-2a4 4 0 0 0-2-3.5M16 5a3 3 0 0 1 0 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  </svg>

  <main id="game" class="game" aria-label="3% little shop game" aria-busy="true">
    <div class="scene-matte" aria-hidden="true"></div>
    <canvas id="sceneCanvas" role="img" aria-label="Illustrated San Francisco street and a cutaway view of the little shop"></canvas>

    <header class="hud" inert>
      <div class="brand">
        <img id="brandLogo" class="brand-logo" alt="" hidden>
        <p id="brandLocation" class="eyebrow">San Francisco</p>
        <h1 id="brandName">3% <i>little shop</i></h1>
      </div>
      <div class="hud-status">
        <div class="status-bar">
          <button id="environmentButton" class="environment" type="button" data-panel="environment" aria-haspopup="dialog">
            <svg class="icon weather-icon" aria-hidden="true"><use id="weatherIcon" href="#i-sun"></use></svg>
            <span class="environment-copy"><strong id="clockText">Day 1 · 9:00 AM</strong><span id="weatherText">Clear</span></span>
            <svg class="icon chevron-icon" aria-hidden="true"><use href="#i-chevron"></use></svg>
          </button>
          <div class="balance" aria-label="Shop balance"><span class="balance-kicker">Shop balance</span><output id="balance">$500</output></div>
          <button class="icon-button help-button" type="button" data-panel="help" aria-haspopup="dialog" aria-label="Help and settings" title="Help and settings"><svg class="icon" aria-hidden="true"><use href="#i-help"></use></svg></button>
        </div>
        <p id="saveStatus" hidden class="save-status"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg><span id="saveLabel">Checking browser storage</span></p>
      </div>
    </header>

    <div class="scene-notice" id="sceneNotice" role="status">Loading the shop…</div>

    <p id="counterAnnouncement" class="visually-hidden" role="status" aria-atomic="true"></p>

    <div class="bottom-hud">
      <section class="goal" aria-labelledby="goalTitle">
        <div class="goal-heading">
          <span class="goal-badge"><svg class="icon" aria-hidden="true"><use href="#i-goal"></use></svg></span>
          <div><h2 id="goalTitle">Your first little milestone</h2><p id="goalText">Sell 3 pieces</p></div>
        </div>
        <div class="goal-tracker">
          <progress id="goalProgress" max="3" value="0" aria-label="Pieces sold toward first milestone"></progress>
          <span id="goalCount">0/3</span>
          <span id="goalReward" class="goal-reward" aria-label="Virtual reward">+$50</span>
        </div>
      </section>

      <div class="control-area">
        <aside id="counterCard" class="counter-card" aria-label="Requests and closing summary" hidden inert></aside>
        <button id="craftStatus" class="craft-status" type="button" data-panel="make" aria-haspopup="dialog" hidden inert>
          <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
          <span id="craftLabel"></span>
          <progress id="craftProgress" aria-label="Craft progress" max="1" value="0"></progress>
          <span id="craftTime"></span>
        </button>
        <p id="shopHint" class="shop-hint">Make and stock pieces before opening.</p>
        <button id="momentPrompt" class="moment-prompt" type="button" data-panel="neighbors" hidden inert></button>
        <nav class="dock" aria-label="Shop actions" inert>
          <button class="dock-button" type="button" data-panel="make" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-make"></use></svg><span>Make</span></button>
          <button class="dock-button" type="button" data-panel="stock" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-stock"></use></svg><span>Stock</span></button>
          <button class="dock-button" type="button" data-panel="decor" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-decor"></use></svg><span>Decor</span></button>
          <button id="neighborsButton" class="dock-button neighbors-button" type="button" data-panel="neighbors" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-neighbors"></use></svg><span>Neighbors</span></button>
          <button id="openButton" class="dock-button open-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-shop"></use></svg><span id="openLabel">Open shop</span></button>
        </nav>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-atomic="true"></div>
  </main>

  <dialog id="shopDialog" class="shop-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-head">
      <div><p id="dialogKicker" class="eyebrow"></p><h2 id="dialogTitle"></h2></div>
      <button id="closeDialog" class="icon-button" type="button" aria-label="Close dialog"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div id="dialogBody" class="dialog-body"></div>
    <p id="dialogFeedback" class="dialog-feedback" role="status" aria-atomic="true"></p>
  </dialog>
  <input id="saveFile" type="file" accept=".json,application/json" hidden>
</body>
</html>
